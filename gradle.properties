# Gollek Engine Feature Flags
# Comma-separated list of backends to include: cpu, cuda, metal
gollek.backend=cpu,metal
# Strategy for backend selection: fallback, strict
gollek.strategy=fallback

# Enable inference APIs (Runtime, Diffusion, Model)
gollek.inference=true

# Optimization Flags
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Ignore Kotlin JVM target mismatch for JDK 28 Babylon
kotlin.jvm.target.validation.mode=warning

# Force Gradle to run on JDK 25 to avoid Kotlin DSL compilation errors with JDK 28
org.gradle.java.home=/opt/homebrew/Cellar/openjdk/25.0.2/libexec/openjdk.jdk/Contents/Home
